# The Starbite boot catalog: every entry the loader can start (shim/starlte/catalog.h).
# tools/store/sbstore2.py packs it into the OS store as "catalog"; without one the loader uses
# its built-in copy of the first four entries.
#
#   key       what the menu, settings and boot-next use (menu v5 shows ios26, win11, android, linux;
#             at most 23 characters: reboot-to KEY writes it into the SBNEXT2! mailbox)
#   category  apple microsoft android linux starbite other lab
#   method    xnu linux android uefi bare
#   tag       daily beta experimental lab stable
#   files     store entry names ("ufs:" / "sd:" pick the medium, "a|b" = alternatives); "@boot" is
#             BOOT's own iOS payload, "@bundle" BOOT's UEFI bundle. xnu: payload. linux: Image, DTB,
#             initrd (optional). android: kernel, ramdisk, cmdline file (optional). uefi / bare: image.
#   cmdline   appended to the OS's own command line
#   root      where the OS keeps its root (shown, not used by the loader)
#   flags     ["hidden"]: only in Engineer's "Start an OS"
# Strings use the loader's font: ASCII and ° · … ↑ ↓ ← → µ ± × ■ ▲ ▼ ✓

[[entry]]
key = "ios26"
name = "iOS 26"
version = "26.6.2 · XNU 12377"
category = "apple"
method = "xnu"
tag = "beta"
files = ["@boot"]
root = "ufs:USERDATA (HFSX, 16 GiB)"

[[entry]]
key = "win11"
name = "Windows 11"
version = "23H2 · NT 22631"
category = "microsoft"
method = "uefi"
tag = "experimental"
files = ["windows.uefi|@bundle"]
root = "ufs:WINDOWS (NTFS)"

[[entry]]
key = "android"
name = "Android 17"
version = "LineageOS 24.0 · Linux 4.9"
category = "android"
method = "android"
tag = "experimental"
files = ["android.kernel", "android.ramdisk", "android.cmdline"]
root = "ufs:SYSTEM + A16DATA"

# ---- Linux (docs/LINUX-REBUILD-PLAN.md 3.3): one kernel, DTB and initrd for every entry; the
# initrd (tools/linux/init) reads sb.root= etc. from the cmdline and boots /distros/<name>.img
# from the card's exFAT (p1). Entries whose image does not exist yet are hidden; un-hide one once
# card-install.sh has put its image on the card.
[[entry]]
key = "linux-shell"
name = "Starbite shell"
version = "Linux 7.1 · rescue · installer"
category = "linux"
method = "linux"
tag = "stable"
files = ["linux.image", "linux.dtb", "linux.initrd"]
cmdline = "sb.root=none"
root = "initramfs + sd:p1 /distros/_tools.img"

[[entry]]
key = "linux-ubuntu"
name = "Ubuntu"
version = "26.04 LTS · Phosh · Linux 7.1"
category = "linux"
method = "linux"
tag = "beta"
files = ["linux.image", "linux.dtb", "linux.initrd"]
cmdline = "sb.root=/distros/ubuntu.img sb.session=phosh"
root = "sd:p1 /distros/ubuntu.img"

[[entry]]
key = "linux-ubuntu-gnome"
name = "Ubuntu Desktop"
version = "26.04 LTS · GNOME · Linux 7.1"
category = "linux"
