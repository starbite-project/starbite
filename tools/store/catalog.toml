# The mac13 payload with no root device and no card writes: "!rd" (XNU waits for a root device
# with every kernel thread running; wdt=-1 in the payload keeps that wait quiet and endless),
# "!sdrw" (starlte_sd.c refuses every write), "!sdlog !sweetreboot" (no card log, no TWRP timer),
# "!a5fb_noconsole !sweetquiet" (kernel text on the panel). The entry's log replaces
# [defaults.xnu]'s at every level.

