[[entry]]
key = "chromeos"
name = "ChromiumOS"
version = "R158 · Google arm64-generic · Linux 7.1"
category = "android"
method = "linux"
tag = "experimental"
files = ["linux.image", "linux.dtb", "linux.initrd"]
cmdline = "sb.root=/distros/chromeos.img printk.devkmsg=on log_buf_len=4M s9p_decon.drm_name=vkms cros_debug lsm=landlock,lockdown,yama,safesetid,integrity,selinux,bpf enforcing=0 --verbose"
root = "sd:p1 /distros/chromeos.img (GPT: STATE p1, ROOT-A p3)"

# ---- Linux (docs/LINUX-REBUILD-PLAN.md 3.3): one kernel, DTB and initrd for every entry; the
# initrd (tools/linux/init) reads sb.root= etc. from the cmdline and boots /distros/<name>.img
# from the card's exFAT (p1). Entries whose image does not exist yet are hidden; un-hide one once
# card-install.sh has put its image on the card.
[[entry]]
key = "linux-shell"
name = "Starbite shell"
version = "Linux 7.1 · rescue · installer"
category = "linux"
method = "linux"
tag = "stable"
files = ["linux.image", "linux.dtb", "linux.initrd"]
cmdline = "sb.root=none"
root = "initramfs + sd:p1 /distros/_tools.img"
flags = ["hidden"]

