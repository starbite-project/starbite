<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Brand fonts for rsvg-convert (menu.mjs, overlay.mjs, splash.mjs): this
     folder first, then the system's. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig-starbite</cachedir>
</fontconfig>
