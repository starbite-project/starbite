# Starbite Maintenance: /etc/mke2fs.conf. e2fsprogs 1.47's defaults add orphan_file (and newer
# features), which Android's 4.9 kernel cannot mount; metadata-reset.sh's `mke2fs -t ext4` for
# /metadata (ODM) must make what TWRP's mke2fs made. So: e2fsprogs 1.46's ext4 feature set, nothing
# newer. Checked at build time by mk-maint.sh (dumpe2fs of a test filesystem).
[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	default_mntopts = acl,user_xattr
	enable_periodic_fsck = 0
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384

[fs_types]
	ext3 = {
		features = has_journal
	}
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,metadata_csum,64bit,dir_nlink,extra_isize
	}
	small = {
		blocksize = 1024
		inode_ratio = 4096
	}
	floppy = {
		blocksize = 1024
		inode_ratio = 8192
	}
	big = {
		inode_ratio = 32768
	}
	huge = {
		inode_ratio = 65536
	}
	news = {
		inode_ratio = 4096
	}
	largefile = {
		inode_ratio = 1048576
		blocksize = -1
	}
	largefile4 = {
		inode_ratio = 4194304
		blocksize = -1
	}
	hurd = {
		blocksize = 4096
		inode_size = 128
		warn_y2038_dates = 0
	}

[options]
	fname_encoding = utf8
