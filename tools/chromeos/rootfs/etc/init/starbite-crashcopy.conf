# Starbite: copy crash dumps and Chrome's logs to the unencrypted part of STATE, which TWRP can read
# (losetup -r -o <p1 offset> on the card's chromeos.img, mount -o ro,noload). /home and /var are encrypted.
description     "Starbite: crash dumps and logs to stateful/unencrypted/starbite-crash"
start on started syslog
stop on stopping syslog
respawn
respawn limit 5 30
exec sh -c 'D=/mnt/stateful_partition/unencrypted/starbite-crash; mkdir -p $D/crash $D/log; while :; do for s in /home/chronos/crash /var/spool/crash /home/chronos/user/crash; do [ -d $s ] && cp -an $s/. $D/crash/ 2>/dev/null; done; for s in /var/log/chrome /var/log/ui; do [ -d $s ] && cp -aL --no-preserve=ownership $s $D/log/ 2>/dev/null; done; cp -a /var/log/messages $D/log/ 2>/dev/null; sync; sleep 5; done'
