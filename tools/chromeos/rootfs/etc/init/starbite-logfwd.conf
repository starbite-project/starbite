# Starbite: copy syslog into the kernel log, which the Starbite init saves to the card
# (/distros/chromeos-boot.log). /var/log is on the encrypted stateful partition, unreadable from TWRP.
# The kernel's own lines are dropped: rsyslog reads the kernel log too, so they would loop. Lines are cut
# to 800 characters: /dev/kmsg refuses records over 1 KiB, and the failed write ended the pipeline (boot 14).
description     "Starbite: syslog to /dev/kmsg"
start on started syslog
stop on stopping syslog
respawn
respawn limit 5 30
exec sh -c 'tail -n +1 -F /var/log/messages 2>/dev/null | sed -u -e "/ kernel: /d" -e "s/^\(.\{800\}\).*/\1/" > /dev/kmsg'
