# The concept's demo systems (docs/concepts/ios27-boot.html, P) as a boot catalog, for menu v7's
# preview harness (docs/MENU7-PORT.md section 5): the concept's states rendered from menu7.c with
# this catalog match the concept's own data. Keys are the concept's entry ids. Ready entries are the
# concept's 'ready' ones: pass them to the harness as
#   --ready ios26,win11,a17,phosh,display,touch,uart,mem
#   --settings default=phosh,last=ios26,timeout=5
# 'coming' entries have an empty first file; 'missing' ones name files the harness reports absent.
#   python3 tools/store/sbstore2.py catalog tools/menu7/preview/concept-catalog.toml OUT.sbc

[[entry]]
key = "ios26"
name = "iOS 26"
version = "26.6.2 · XNU 12377"
category = "apple"
method = "xnu"
tag = "beta"
files = ["@boot"]

