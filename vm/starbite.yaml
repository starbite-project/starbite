# Lima VM for the build: Ubuntu 24.04 ARM64 on Apple's Virtualization.framework.
# limactl start --name=starbite vm/starbite.yaml ; limactl shell starbite
base: template://ubuntu-24.04
vmType: vz
arch: aarch64
cpus: 8
memory: 10GiB
disk: 70GiB
# Only the project folder: a "~" mount (Lima default) would shadow it read-only.
mounts:
  - location: "~/project-starbite"
    writable: true
mountType: virtiofs
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -e
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y build-essential git curl wget clang lld llvm python3 python3-pip perl xz-utils \
        liblz4-dev lz4 qemu-system-arm qemu-efi-aarch64 device-tree-compiler hfsprogs fuse3 \
        libfuse3-dev cmake zlib1g-dev libbz2-dev libattr1-dev libssl-dev bison flex bc cpio \
        android-sdk-libsparse-utils unzip zstd file uuid-dev nasm acpica-tools
  # edk2 for tools/woa/build-uefi.sh: master 2938b830 (NOTES.md W2), BaseTools built.
  - mode: user
    script: |
      #!/bin/bash
      set -e
      mkdir -p ~/work && cd ~/work
      [ -d edk2 ] || git clone -q https://github.com/tianocore/edk2.git
      cd edk2
      git checkout -q 2938b830
      git submodule update -q --init --depth 1 \
        BaseTools/Source/C/BrotliCompress/brotli MdeModulePkg/Library/BrotliCustomDecompressLib/brotli \
        MdePkg/Library/BaseFdtLib/libfdt MdePkg/Library/MipiSysTLib/mipisyst \
        CryptoPkg/Library/OpensslLib/openssl CryptoPkg/Library/MbedTlsLib/mbedtls \
        UnitTestFrameworkPkg/Library/CmockaLib/cmock UnitTestFrameworkPkg/Library/GoogleTestLib/googletest \
        UnitTestFrameworkPkg/Library/SubhookLib/subhook RedfishPkg/Library/JsonLib/jansson \
        MdeModulePkg/Universal/RegularExpressionDxe/oniguruma SecurityPkg/DeviceSecurity/SpdmLib/libspdm 2>/dev/null || git submodule update -q --init
      make -s -C BaseTools -j"$(nproc)" >/tmp/basetools.log 2>&1 || { tail -20 /tmp/basetools.log; exit 1; }
      echo "edk2 ready at $(git rev-parse --short=8 HEAD)"
