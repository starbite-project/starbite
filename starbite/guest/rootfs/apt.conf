// /etc/apt/apt.conf.d/90starbite (mk-base.sh): the guest's apt, offline from /repo
APT::Install-Recommends "false";
APT::Install-Suggests "false";
Acquire::Languages "none";
APT::Sandbox::User "root";
// the guest has no RTC and no network time yet: its clock may say 1970, and a Release dated 2026 would be "not
// valid yet"; the only source is the local, trusted /repo
Acquire::Check-Date "false";
Acquire::Check-Valid-Until "false";
DPkg::Lock::Timeout "120";
Dpkg::Options { "--force-confdef"; "--force-confold"; };
Dpkg::Use-Pty "0";
