# /etc/asound.conf of the Starbite Linux guest: the card "Starbite" (sbguest.ko's sbsnd: Starbite OS's speaker and
# mic, fixed 48000 Hz S16_LE stereo) is the default ALSA device for alsa-lib applications.
#   default    playback: plug (any rate / format / channels) -> softvol "Master" -> dmix (several apps at once)
#              capture:  plug -> dsnoop (several readers at once)
# The hardware PCM takes one opener per direction; dmix / dsnoop share it. "hw:Starbite" stays reachable directly
# (one app, exclusive). PipeWire / PulseAudio, when a later image brings them, open hw:Starbite themselves and this
# default is then only for apps that bypass them.

pcm.starbite_dmix {
    type dmix
    ipc_key 0x53426e64          # "SBnd"
    ipc_perm 0666
    slave {
        pcm "hw:Starbite,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024        # 21.3 ms
        buffer_size 4096        # 85 ms (+ sbsnd's ring and the host's latency: snd_pcm_delay has them all)
    }
}

pcm.starbite_dsnoop {
    type dsnoop
    ipc_key 0x53426e65
    ipc_perm 0666
    slave {
        pcm "hw:Starbite,0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024
        buffer_size 4096
    }
}

pcm.starbite_vol {
    type softvol
    slave.pcm "starbite_dmix"
    control {
        name "Master Playback Volume"
        card Starbite
    }
    min_dB -51.0
    max_dB 0.0
}

pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave.pcm "starbite_vol"
    }
    capture.pcm {
        type plug
        slave.pcm "starbite_dsnoop"
    }
    hint.description "Starbite OS speaker and microphone"
}

ctl.!default {
    type hw
    card Starbite
}
