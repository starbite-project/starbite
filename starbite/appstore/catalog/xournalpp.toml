id = "xournalpp"
name = "Xournal++"
summary = "Handwritten notes and PDF annotation"
description = """Xournal++ is a notebook for handwriting, sketching and annotating PDFs, with pen, highlighter, shapes, text and LaTeX. Works with a finger or a stylus."""
category = "Office"
licence = "GPL-2.0-or-later"
homepage = "https://xournalpp.github.io"
icon = "com.github.xournalpp.xournalpp"
ram_mb = 120
featured = true
default = "release"
touch = "good"
keywords = ["notes", "handwriting", "pdf", "annotate", "stylus"]

[launcher]
exec = "xournalpp"
terminal = false
keyboard = false

# format appimage/binary: the downloaded file is installed and linked as bin[0]
[release]
provider = "github"
repo = "xournalpp/xournalpp"
asset = "xournalpp-*-aarch64.AppImage"
prerelease = false
version_from = "regex:^v(.+)$"
format = "appimage"
bin = ["xournalpp"]
size_mb = 40

[release.verify]
github_digest = true

[distro]
apt = ["xournalpp"]

[runtime]
apt = ["libfuse2t64"]
needs = ["files"]
note = "Upstream also ships Ubuntu .debs for aarch64; the AppImage is used because it does not depend on Ubuntu library versions. Debian has 1.2.x."

[source]
# Debian's own source of the package, compiled on the M3s (matches trixie's libraries)
system = "debian"
build_min = 20
build_mb = 1500
