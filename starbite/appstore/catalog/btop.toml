id = "btop"
name = "btop"
summary = "A resource monitor for CPU, memory, disks and network"
description = """btop shows CPU per core, memory, disks, network and processes in a colourful terminal dashboard. Tap to sort, select and signal processes."""
category = "System"
licence = "Apache-2.0"
homepage = "https://github.com/aristocratos/btop"
icon = "btop"
ram_mb = 10
featured = false
default = "release"
touch = "good"
keywords = ["monitor", "cpu", "memory", "processes", "tui"]

[launcher]
exec = "btop"
terminal = true
keyboard = false

# static musl build; archive paths start with ./btop/ (sbstore drops "." parts, so strip 1)
[release]
provider = "github"
repo = "aristocratos/btop"
asset = "btop-aarch64-unknown-linux-musl.tar.gz"
prerelease = false
version_from = "regex:^v(.+)$"
format = "tar"
strip = 1
bin = ["bin/btop"]
size_mb = 3

[release.verify]
github_digest = true

[source]
tarball = "https://github.com/aristocratos/btop/archive/refs/tags/{tag}.tar.gz"
ref = "release"
system = "script"
build_deps = ["build-essential"]
steps = ["make -j\"$JOBS\"", "make install PREFIX=\"$PREFIX\""]
bin = ["bin/btop"]
build_min = 6
build_mb = 300

[distro]
apt = ["btop"]

[runtime]
note = "Debian has 1.3.2; the release is a static build of the latest. Source needs C++23 (gcc 14 in trixie)."
