id = "celluloid"
name = "Celluloid"
summary = "A simple video player built on mpv"
description = """Celluloid is a GTK front end for mpv with big, touch-friendly controls, playlists and drag-and-drop. Same playback engine as mpv, friendlier interface."""
category = "Media"
licence = "GPL-3.0-or-later"
homepage = "https://celluloid-player.github.io"
icon = "io.github.celluloid_player.Celluloid"
ram_mb = 150
featured = true
default = "distro"
touch = "good"
keywords = ["video", "player", "mpv", "media"]

[launcher]
exec = "celluloid"
terminal = false
keyboard = false

[distro]
apt = ["celluloid"]

[runtime]
needs = ["audio", "files"]
note = "No upstream binaries; the latest source (0.30) needs libadwaita 1.8, trixie has 1.7, so no source method."

[source]
# Debian's own source of the package, compiled on the M3s (matches trixie's libraries)
system = "debian"
build_min = 5
build_mb = 700
