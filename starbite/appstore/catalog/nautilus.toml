id = "nautilus"
name = "Files"
summary = "Browse and manage your files (Nautilus)"
description = """GNOME Files (Nautilus) browses folders, copies, moves, renames and searches files, with previews and an adaptive layout for narrow screens."""
category = "Utilities"
licence = "GPL-3.0-or-later"
homepage = "https://apps.gnome.org/Nautilus/"
icon = "org.gnome.Nautilus"
ram_mb = 150
featured = true
default = "distro"
touch = "good"
keywords = ["files", "file manager", "folders", "browse"]

[launcher]
exec = "nautilus --new-window"
terminal = false
keyboard = false

[distro]
apt = ["nautilus"]

[runtime]
needs = ["files"]

[source]
# Debian's own source of the package, compiled on the M3s (matches trixie's libraries)
system = "debian"
build_min = 15
build_mb = 1500
