id = "btop"
name = "btop"
summary = "Resource monitor"
category = "System"
licence = "Apache-2.0"
ram_mb = 15
[launcher]
exec = "btop"
terminal = true
[release]
provider = "github"
repo = "aristocratos/btop"
asset = "btop-aarch64-*linux-musl.tbz"
format = "tar"
strip = 1
bin = ["bin/btop"]
size_mb = 5
[source]
ref = "release"
tarball = "https://github.com/aristocratos/btop/archive/refs/tags/{tag}.tar.gz"
system = "make"
build_deps = ["build-essential"]
options = []
bin = ["bin/btop"]
build_min = 4
build_mb = 300
size_mb = 5
[distro]
apt = ["btop"]
